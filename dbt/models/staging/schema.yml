version: 2

models:
  - name: stg_example
    description: "Scaffold staging model. Replace with real ones."
    columns:
      - name: id
        description: "Primary key"
        tests:
          - not_null
          - unique
      - name: category
        tests:
          - not_null
          - accepted_values:
              values: ["books", "electronics", "home"]
      - name: amount
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ["delivered", "shipped", "canceled"]
