name: "portfolio_project"
version: "1.0.0"
config-version: 2

profile: "portfolio_project"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  portfolio_project:
    staging:
      +materialized: view
    marts:
      +materialized: table

# The seed slice stands in for the bronze sources ONLY on the CI (duckdb) target.
# On Athena it must never run: the seed names collide with the bronze external
# tables and dbt would overwrite them.
seeds:
  portfolio_project:
    +enabled: "{{ target.name == 'ci' }}"
