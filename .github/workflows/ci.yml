name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: dbt on the seed slice (DuckDB, no cloud creds)
        working-directory: dbt
        run: |
          cp profiles.ci.yml profiles.yml
          dbt seed --target ci
          dbt run --target ci
          dbt test --target ci

      - name: SQLFluff (advisory)
        working-directory: dbt
        run: sqlfluff lint models --dialect duckdb || true
