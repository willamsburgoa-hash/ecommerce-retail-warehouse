[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "de-portfolio-project"
version = "0.1.0"
description = "Data engineering portfolio project"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "awswrangler>=3.9",
    "pyarrow>=16",
    "pandas>=2.2",
    "requests>=2.32",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "streamlit>=1.38",
    "dbt-core>=1.8",
]

[project.optional-dependencies]
aws = ["dbt-athena-community>=1.8", "dagster>=1.8", "dagster-webserver>=1.8", "dagster-dbt>=0.24"]
databricks = ["dbt-databricks>=1.8", "databricks-sdk>=0.30", "pyspark>=3.5"]
quality = ["great-expectations>=1.0", "soda-core-athena>=3.3"]
dev = ["ruff>=0.6", "sqlfluff>=3.1", "pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.sqlfluff.core]
dialect = "athena"
templater = "dbt"
max_line_length = 120
exclude_rules = "RF04"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
