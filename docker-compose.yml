# Local, reproducible run of the whole pipeline: ingest -> dbt build -> dashboard.
# Adjust per project (P3/P4 run on Databricks, so they only use the `dbt` + `dashboard` idea locally).

services:
  ingest:
    build: .
    env_file: .env
    command: python scripts/ingest.py
    volumes:
      - ./:/app

  dbt:
    build: .
    env_file: .env
    working_dir: /app/dbt
    command: dbt build --profiles-dir .
    depends_on:
      ingest:
        condition: service_completed_successfully
    volumes:
      - ./:/app

  dashboard:
    build: .
    env_file: .env
    command: streamlit run dashboards/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      dbt:
        condition: service_completed_successfully
    volumes:
      - ./:/app

  # Uncomment for the AWS projects (P1, P2) to get a scheduler UI at http://localhost:3000
  # dagster:
